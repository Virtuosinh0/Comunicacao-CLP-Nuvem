spring.application.name=clp-nuvem-api
server.port=${PORT:8080}

# JSON em snake_case (reactor_id, op_code, ...) <-> records Java em camelCase.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Sem leitura nova do tanque ha mais que isso (relogio da API) -> "stale": true no GET.
# DataManager envia a cada 5 s; 30 s tolera algumas falhas seguidas.
telemetry.stale-after=30s
# Timestamp da leitura mais no futuro que isso (relogio do gateway adiantado) -> 400.
telemetry.max-clock-skew=5m

# ---------- Seguranca: so IPs previamente autorizados ----------
# IP (192.168.0.10) ou faixa CIDR (192.168.0.0/24), IPv4 ou IPv6, separados por virgula.
# Fora da lista -> 403 + "ACESSO BLOQUEADO" no log. Padrao: so este computador (127.0.0.1 / ::1).
# Na nuvem: o IP publico fixo do gateway em CLP_API_GATEWAY_IPS e os da fabrica/escritorio em CLP_API_VIEWER_IPS.
#
# Quem pode ENVIAR leituras (POST /api/v1/telemetry/**): so o(s) DataManager(s).
security.allowed-ips.gateway=${CLP_API_GATEWAY_IPS:127.0.0.1,::1}
# Quem pode VER a tela e consultar (GET /api/v1/production/**, pagina web).
security.allowed-ips.viewers=${CLP_API_VIEWER_IPS:127.0.0.1,::1}
